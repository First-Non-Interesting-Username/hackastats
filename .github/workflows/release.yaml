name: Create release

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
        description: "Version tag to be released. This project uses zenver"

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y gnome-shell libglib2.0-bin

      - name: Pack extension
        run: |
          mkdir -p dist
          gnome-extensions pack --force --out-dir dist hackastats@first-non-interesting-username.github.io
          ls -lh dist

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            dist/*.zip
          generate_release_notes: true
          tag_name: "${{ inputs.version }}"
          body: |
            Installation instruction:

            1. Download the zip file from the assets
            2. Run `gnome-extensions install --force hackastats@first-non-interesting-username.github.io.shell-extension.zip` to install the extension
            3. Enable the extension in the GNOME Extensions app or run `gnome-extensions enable hackastats@first-non-interesting-username.github.io`
            4. Restart GNOME Shell by logging out and back in.
