name: Green checkmark giver

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true

      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-bin

      - name: Compile Schemas
        run: glib-compile-schemas hackastats@first-uninteresting-username.github.io/schemas/

      - name: Run prettier
        run: npx --yes prettier --check .
